<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftHQ Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0a0a0a;color:#f0f0ee;font-family:'Plus Jakarta Sans',sans-serif;}
.nav{background:#111;border-bottom:1px solid #1e1e1e;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;}
.nav-dot{width:7px;height:7px;background:#f59e0b;border-radius:50%;}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:#f59e0b;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:4px;padding:2px 6px;letter-spacing:1px;}

/* LOGIN */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);padding:40px 20px;}
.login-box{width:100%;max-width:340px;background:#111;border:1px solid #1e1e1e;border-radius:18px;padding:32px 24px;}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px;}
.login-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;letter-spacing:1px;margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{font-family:'JetBrains Mono',monospace;font-size:9px;color:#555;letter-spacing:1px;display:block;margin-bottom:5px;}
.field input{width:100%;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:10px;color:#f0f0ee;font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 13px;outline:none;transition:border-color .15s;}
.field input:focus{border-color:#f59e0b;}
.btn-login{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-login:active{opacity:.9;}
.login-err{font-family:'JetBrains Mono',monospace;font-size:11px;color:#ef4444;min-height:16px;margin-top:10px;text-align:center;}

/* ADMIN PANEL */
#adminScreen{display:none;padding:20px;max-width:900px;margin:0 auto;}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:4px;}
.page-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;letter-spacing:1px;margin-bottom:20px;}

/* Stats bar */
.stat-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:#111;border:1px solid #1e1e1e;border-radius:13px;padding:14px 16px;}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:#444;margin-top:2px;letter-spacing:.5px;}

/* Business list */
.biz-card{background:#111;border:1px solid #1e1e1e;border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.biz-info{flex:1;min-width:0;}
.biz-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.biz-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;margin-top:2px;}
.biz-meta{font-family:'JetBrains Mono',monospace;font-size:10px;margin-top:4px;}
.plan-pro{color:#4ade80;}
.plan-free{color:#555;}
.plan-expiring{color:#f59e0b;}
.plan-expired{color:#ef4444;}
.biz-actions{display:flex;gap:7px;flex-shrink:0;}
.btn-pro{padding:8px 14px;border:none;border-radius:9px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-pro:hover{opacity:.9;}
.btn-free{padding:8px 14px;border:1px solid #2a2a2a;border-radius:9px;background:transparent;color:#888;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap;}
.btn-free:hover{border-color:#555;color:#f0f0ee;}
.badge-pro{background:rgba(22,163,74,.12);color:#4ade80;border:1px solid rgba(22,163,74,.2);font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;}
.badge-free{background:#1a1a1a;color:#555;border:1px solid #2a2a2a;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;}
.badge-expiring{background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.2);font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;}

/* Days input */
.days-row{display:flex;align-items:center;gap:6px;}
.days-inp{width:60px;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:8px;color:#f0f0ee;font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 9px;outline:none;text-align:center;}
.days-inp:focus{border-color:#16a34a;}

.empty{text-align:center;padding:48px 20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#333;}
.toast-wrap{position:fixed;bottom:24px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:999;}
.toast{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;animation:slideIn .2s ease;}
.toast.ok{border-color:rgba(22,163,74,.4);color:#4ade80;}
.toast.err{border-color:rgba(239,68,68,.4);color:#f87171;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.refresh-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:9px;padding:8px 14px;color:#888;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;float:right;}
.refresh-btn:hover{color:#f0f0ee;border-color:#555;}
.signout-btn{background:transparent;border:none;font-family:'JetBrains Mono',monospace;font-size:10px;color:#333;cursor:pointer;padding:4px 8px;}
.signout-btn:hover{color:#888;}
.search-inp{width:100%;background:#111;border:1.5px solid #1e1e1e;border-radius:10px;color:#f0f0ee;font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 14px;outline:none;margin-bottom:14px;transition:border-color .15s;}
.search-inp:focus{border-color:#f59e0b;}
.search-inp::placeholder{color:#333;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><div class="nav-dot"></div>ShiftHQ <span class="nav-tag">ADMIN</span></div>
  <button class="signout-btn" id="signoutBtn" style="display:none;" onclick="adminSignOut()">Sign out</button>
</nav>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">Admin Access</div>
    <div class="login-sub">SHIFTHQ INTERNAL · RESTRICTED</div>
    <div class="field">
      <label>ADMIN KEY</label>
      <input type="password" id="adminKeyInput" placeholder="Enter admin key" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">Access Panel</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminScreen">
  <div class="page-title">Businesses <button class="refresh-btn" onclick="loadBusinesses()">↻ Refresh</button></div>
  <div class="page-sub" id="lastRefresh"></div>

  <div class="stat-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-lbl">TOTAL BUSINESSES</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#4ade80;" id="statPro">—</div><div class="stat-lbl">PRO ACTIVE</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#f59e0b;" id="statExpiring">—</div><div class="stat-lbl">EXPIRING IN 7 DAYS</div></div>
  </div>

  <input type="text" class="search-inp" id="searchInp" placeholder="Search by name or code..." oninput="renderList()">

  <div id="bizList"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
var API = 'https://ems-api-mgye.onrender.com';
var ADMIN_KEY = '';
var businesses = [];

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  var key = document.getElementById('adminKeyInput').value.trim();
  var err = document.getElementById('loginErr');
  if (!key) { err.textContent = 'Enter admin key'; return; }
  err.textContent = 'Verifying...';
  try {
    var r = await fetch(API + '/api/admin/businesses', {
      headers: { 'x-admin-key': key }
    });
    if (!r.ok) { err.textContent = 'Invalid admin key'; return; }
    ADMIN_KEY = key;
    sessionStorage.setItem('shq_admin_key', key);
    showPanel();
    var data = await r.json();
    businesses = data;
    renderStats();
    renderList();
    updateTimestamp();
  } catch(e) { err.textContent = 'Connection error: ' + e.message; }
}

function adminSignOut() {
  ADMIN_KEY = '';
  sessionStorage.removeItem('shq_admin_key');
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('signoutBtn').style.display = 'none';
  document.getElementById('adminKeyInput').value = '';
}

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.getElementById('signoutBtn').style.display = 'block';
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
async function loadBusinesses() {
  try {
    var r = await fetch(API + '/api/admin/businesses', { headers: { 'x-admin-key': ADMIN_KEY } });
    if (!r.ok) { toast('Failed to load', 'err'); return; }
    businesses = await r.json();
    renderStats();
    renderList();
    updateTimestamp();
  } catch(e) { toast('Connection error', 'err'); }
}

function updateTimestamp() {
  var n = new Date();
  document.getElementById('lastRefresh').textContent =
    'Last updated ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  var now = new Date();
  var in7 = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
  var pro = businesses.filter(function(b) { return b.plan === 'pro'; });
  var expiring = pro.filter(function(b) {
    if (!b.pro_expires_at) return false;
    var exp = new Date(b.pro_expires_at);
    return exp > now && exp <= in7;
  });
  document.getElementById('statTotal').textContent = businesses.length;
  document.getElementById('statPro').textContent = pro.length;
  document.getElementById('statExpiring').textContent = expiring.length;
}

// ── RENDER LIST ───────────────────────────────────────────────────────────────
function renderList() {
  var q = document.getElementById('searchInp').value.trim().toLowerCase();
  var filtered = businesses.filter(function(b) {
    if (!q) return true;
    return (b.name||'').toLowerCase().includes(q) || (b.code||'').toLowerCase().includes(q);
  });

  if (!filtered.length) {
    document.getElementById('bizList').innerHTML = '<div class="empty">No businesses found</div>';
    return;
  }

  var now = new Date();
  var in3 = new Date(now.getTime() + 3 * 24 * 60 * 60 * 1000);
  var in7 = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

  var html = filtered.map(function(b) {
    var isPro = b.plan === 'pro' || b.plan === 'business';
    var isBiz = b.plan === 'business';
    var isBlocked = b.is_blocked === true;
    var expDate = b.pro_expires_at ? new Date(b.pro_expires_at) : null;
    var expired = expDate && expDate < now;
    var expiring3 = expDate && expDate > now && expDate <= in3;
    var expiring7 = expDate && expDate > now && expDate <= in7;

    var badge = isPro && !expired
      ? (expiring3
          ? '<span class="badge-expiring">⚠ EXPIRING SOON</span>'
          : isBiz ? '<span class="badge-pro" style="color:#a855f7;background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);">⭐ BUSINESS</span>'
          : '<span class="badge-pro">PRO</span>')
      : '<span class="badge-free">FREE</span>';

    var meta = '';
    if (isPro && expDate && !expired) {
      var daysLeft = Math.ceil((expDate - now) / (1000*60*60*24));
      var cls = expiring3 ? 'plan-expiring' : 'plan-pro';
      meta = '<span class="' + cls + '">'+(isBiz?'Business':'Pro')+' until ' + expDate.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' (' + daysLeft + ' days)</span>';
    } else if (isPro && expired) {
      meta = '<span class="plan-expired">Pro expired — auto-downgraded</span>';
    } else {
      meta = '<span class="plan-free">Free plan</span>';
    }

    var actions = '<div class="days-row" style="flex-wrap:wrap;gap:6px;">' +
      '<input type="number" class="days-inp" id="days_'+b.id+'" value="'+(isBiz?365:30)+'" min="1" max="730">' +
      ((!isPro || expired) ? '<button class="btn-pro" onclick="activatePro('+b.id+',\''+escAttr(b.name)+'\',\'pro\')">▶ Pro</button>' : '') +
      (!isBiz ? '<button class="btn-pro" style="background:linear-gradient(135deg,#7c3aed,#a855f7);" onclick="activatePro('+b.id+',\''+escAttr(b.name)+'\',\'business\')">⭐ Biz</button>' : '') +
      (isPro && !expired ? '<button class="btn-free" onclick="deactivatePro('+b.id+',\''+escAttr(b.name)+'\')">↓ Free</button>' : '') +
      '</div>';

    var dangerActions =
      '<div style="display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #1e1e1e;">' +
      (isBlocked
        ? '<button class="btn-pro" style="background:linear-gradient(135deg,#0369a1,#0284c7);font-size:10px;padding:6px 10px;" onclick="toggleBlock('+b.id+',\''+escAttr(b.name)+'\',false)">✓ Unblock</button>'
        : '<button style="padding:6px 10px;border:1px solid rgba(245,158,11,.3);border-radius:8px;background:rgba(245,158,11,.08);color:#f59e0b;font-family:\'JetBrains Mono\',monospace;font-size:10px;cursor:pointer;" onclick="toggleBlock('+b.id+',\''+escAttr(b.name)+'\',true)">⛔ Suspend</button>') +
      '<button style="padding:6px 10px;border:1px solid rgba(239,68,68,.3);border-radius:8px;background:rgba(239,68,68,.08);color:#f87171;font-family:\'JetBrains Mono\',monospace;font-size:10px;cursor:pointer;" onclick="deleteBusiness('+b.id+',\''+escAttr(b.name)+'\')">🗑 Delete</button>' +
      '</div>';

    return '<div class="biz-card" id="biz_'+b.id+'" style="'+(isBlocked?'opacity:0.7;border-color:rgba(239,68,68,.2);':'')+'">' +
      '<div class="biz-info">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<div class="biz-name">' + esc(b.name||'Unnamed') + '</div>' +
          badge +
          (isBlocked ? '<span style="background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);font-family:\'JetBrains Mono\',monospace;font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.5px;">⛔ SUSPENDED</span>' : '') +
        '</div>' +
        '<div class="biz-code">Code: ' + esc(b.code||'—') + (b.notify_email ? ' · ' + esc(b.notify_email) : '') + '</div>' +
        '<div class="biz-meta">' + meta + '</div>' +
      '</div>' +
      '<div class="biz-actions"><div>' + actions + dangerActions + '</div></div>' +
    '</div>';
  }).join('');

  document.getElementById('bizList').innerHTML = html;
}

// ── ACTIVATE PRO ─────────────────────────────────────────────────────────────
async function activatePro(id, name, plan) {
  plan = plan || 'pro';
  var daysEl = document.getElementById('days_' + id);
  var days = daysEl ? parseInt(daysEl.value) || 30 : 30;
  if (plan === 'business') days = Math.max(days, 365);
  if (days < 1 || days > 730) { toast('Days must be between 1 and 730', 'err'); return; }
  try {
    var r = await fetch(API + '/api/admin/businesses/' + id + '/plan', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify({ plan: plan, days: days })
    });
    var d = await r.json();
    if (!r.ok) { toast('Failed: ' + (d.error||r.status), 'err'); return; }
    var label = plan === 'business' ? 'Business' : 'Pro';
    toast('✅ ' + name + ' activated ' + label + ' for ' + days + ' days', 'ok');
    await loadBusinesses();
  } catch(e) { toast('Connection error', 'err'); }
}

// ── DEACTIVATE PRO ────────────────────────────────────────────────────────────
async function toggleBlock(id, name, block) {
  var action = block ? 'suspend' : 'unblock';
  var msg = block
    ? 'Suspend ' + name + '? They will not be able to log in until unblocked.'
    : 'Unblock ' + name + '? They will immediately regain access.';
  if (!confirm(msg)) return;
  try {
    var r = await fetch(API + '/api/admin/businesses/' + id + '/block', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify({ blocked: block })
    });
    var d = await r.json();
    if (!r.ok) { toast('Failed: ' + (d.error||r.status), 'err'); return; }
    toast((block ? '⛔ ' + name + ' suspended' : '✓ ' + name + ' unblocked'), block ? 'err' : 'ok');
    await loadBusinesses();
  } catch(e) { toast('Connection error', 'err'); }
}

async function deleteBusiness(id, name) {
  var confirmed = confirm('⚠️ PERMANENTLY DELETE ' + name + '?\n\nThis will delete ALL employees, shifts, payroll data, and leave records. This cannot be undone.');
  if (!confirmed) return;
  var confirmed2 = confirm('Are you absolutely sure? There is no way to recover this data.');
  if (!confirmed2) return;
  try {
    var r = await fetch(API + '/api/admin/businesses/' + id, {
      method: 'DELETE',
      headers: { 'x-admin-key': ADMIN_KEY }
    });
    var d = await r.json();
    if (!r.ok) { toast('Failed: ' + (d.error||r.status), 'err'); return; }
    toast('🗑 ' + name + ' deleted permanently', 'err');
    await loadBusinesses();
  } catch(e) { toast('Connection error', 'err'); }
}

async function deactivatePro(id, name) {
  if (!confirm('Revert ' + name + ' to Free plan?')) return;
  try {
    var r = await fetch(API + '/api/admin/businesses/' + id + '/plan', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
      body: JSON.stringify({ plan: 'free' })
    });
    var d = await r.json();
    if (!r.ok) { toast('Failed: ' + (d.error||r.status), 'err'); return; }
    toast('↩ ' + name + ' reverted to Free', 'ok');
    await loadBusinesses();
  } catch(e) { toast('Connection error', 'err'); }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s||'').replace(/'/g,'\\\''); }

function toast(msg, type) {
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function() { t.remove(); }, 3500);
}

// ── SESSION RESTORE ───────────────────────────────────────────────────────────
(function() {
  var saved = sessionStorage.getItem('shq_admin_key');
  if (saved) {
    ADMIN_KEY = saved;
    showPanel();
    loadBusinesses();
  }
})();

// Auto-refresh every 60 seconds while panel is open
setInterval(function() {
  if (ADMIN_KEY) loadBusinesses();
}, 60000);
</script>
</body>
</html>
