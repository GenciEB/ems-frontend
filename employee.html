<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>ShiftHQ — My Shifts</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0d0d0d;color:#f0f0ee;min-height:100vh;}

/* NAV */
nav{background:rgba(13,13,13,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;}
.nav-logo-dot{width:7px;height:7px;background:linear-gradient(135deg,#2154f4,#06b6d4);border-radius:50%;}
#navName{font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;}

/* LOGIN SCREEN */
#pinScreen{display:flex;flex-direction:column;align-items:center;padding:48px 20px 40px;min-height:calc(100vh - 56px);}
.login-heading{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#fff;margin-bottom:6px;text-align:center;}
.login-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#555;margin-bottom:32px;text-align:center;letter-spacing:0.5px;}
.field-group{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.field-input{background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:12px;color:#f0f0ee;font-family:'JetBrains Mono',monospace;font-size:13px;padding:12px 14px;outline:none;width:100%;transition:border-color .15s;}
.field-input:focus{border-color:#2154f4;}
.field-input::placeholder{color:#444;}
.pin-dots{display:flex;gap:10px;margin-bottom:28px;justify-content:center;}
.pin-dot{width:13px;height:13px;border-radius:50%;background:#2a2a2a;transition:background .15s;}
.pin-dot.filled{background:linear-gradient(135deg,#2154f4,#06b6d4);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px;}
.pin-btn{background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:14px;padding:18px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:#f0f0ee;cursor:pointer;transition:all .12s;text-align:center;-webkit-tap-highlight-color:transparent;}
.pin-btn:active{background:#2154f4;border-color:#2154f4;transform:scale(0.95);}
.pin-btn-ok{background:linear-gradient(135deg,#2154f4,#06b6d4);border-color:transparent;color:#fff;font-size:14px;}
.pin-btn-back{color:#555;font-size:18px;}
.pin-err{font-family:'JetBrains Mono',monospace;font-size:11px;color:#ef4444;min-height:18px;text-align:center;margin-top:16px;}

/* PORTAL */
#portal{display:none;padding:0 0 80px;}

/* Hero card — the main identity moment */
.portal-hero{background:linear-gradient(135deg,#111827 0%,#1e3a5f 100%);border-bottom:1px solid rgba(33,84,244,0.2);padding:24px 20px;position:relative;overflow:hidden;}
.portal-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(33,84,244,0.15) 0%,transparent 70%);pointer-events:none;}
.hero-identity{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.hero-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2154f4,#06b6d4);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;}
.hero-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#fff;line-height:1.1;}
.hero-role{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6b8fc9;margin-top:3px;letter-spacing:0.5px;}
.hero-biz{font-family:'JetBrains Mono',monospace;font-size:9px;color:#445;margin-top:2px;letter-spacing:1px;text-transform:uppercase;}

/* Clock card — the main action */
#clockCard{}
.clock-in-btn{width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(135deg,#2154f4,#06b6d4);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px -8px rgba(33,84,244,0.6);transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent;}
.clock-in-btn:active{transform:scale(0.97);}
.clock-out-btn{width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(135deg,#dc2626,#f97316);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px -8px rgba(220,38,38,0.5);transition:transform .12s;-webkit-tap-highlight-color:transparent;}
.clock-out-btn:active{transform:scale(0.97);}
.shift-status-bar{background:rgba(22,163,74,0.12);border:1px solid rgba(22,163,74,0.25);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.shift-status-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex-shrink:0;animation:pulse 2s infinite;}
.shift-status-text{font-family:'JetBrains Mono',monospace;font-size:11px;color:#4ade80;}
.done-bar{background:rgba(33,84,244,0.1);border:1px solid rgba(33,84,244,0.2);border-radius:12px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b8fc9;text-align:center;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* Stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:16px 20px 0;}
.stat-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:14px 10px;text-align:center;}
.stat-v{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#2154f4;font-variant-numeric:tabular-nums;}
.stat-k{font-family:'JetBrains Mono',monospace;font-size:8px;color:#555;margin-top:4px;letter-spacing:0.5px;}

/* Tabs */
.tab-section{padding:0 20px;}
.tab-row{display:flex;gap:6px;margin:16px 0 14px;background:#1a1a1a;border-radius:12px;padding:4px;}
.tab{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:#555;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.tab.active{background:#2a2a2a;color:#f0f0ee;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.month-label{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.nav-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#888;}

/* Shift rows */
.shift-row{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.shift-date{font-weight:700;font-size:13px;color:#f0f0ee;}
.shift-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;margin-top:2px;}
.shift-pay{font-family:'JetBrains Mono',monospace;font-size:10px;color:#4ade80;margin-top:2px;}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 9px;border-radius:20px;font-weight:600;}
.badge.done{background:rgba(22,163,74,0.12);color:#4ade80;border:1px solid rgba(22,163,74,0.2);}
.badge.late{background:rgba(220,38,38,0.12);color:#f87171;border:1px solid rgba(220,38,38,0.2);}
.badge.active{background:rgba(33,84,244,0.12);color:#6b8fc9;border:1px solid rgba(33,84,244,0.2);}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:16px;margin-bottom:10px;}
.empty{text-align:center;padding:40px 20px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#444;}
.leave-row{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.signout-btn{width:calc(100% - 40px);margin:20px 20px 0;padding:13px;border:1px solid #2a2a2a;border-radius:12px;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:#555;cursor:pointer;}
/* Kiosk mode */
.kiosk-toggle{display:flex;align-items:center;gap:8px;margin-top:24px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.kiosk-toggle-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;letter-spacing:0.5px;}
.kiosk-switch{width:36px;height:20px;background:#2a2a2a;border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;}
.kiosk-switch.on{background:#2154f4;}
.kiosk-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;}
.kiosk-switch.on::after{transform:translateX(16px);}
/* Success overlay shown in kiosk mode after clock-in/out */
#kioskSuccess{display:none;position:fixed;inset:0;background:#0d0d0d;z-index:999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
#kioskSuccess.show{display:flex;}
.kiosk-success-icon{font-size:64px;margin-bottom:20px;}
.kiosk-success-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;}
.kiosk-success-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:#555;margin-bottom:32px;}
.kiosk-countdown{font-family:'JetBrains Mono',monospace;font-size:11px;color:#333;}
</style>
<link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

<nav>
  <div class="nav-logo"><div class="nav-logo-dot"></div>ShiftHQ</div>
  <div id="navName" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#888;"></div>
</nav>

<div class="container">

<!-- PIN SCREEN -->
<div id="pinScreen">
  <div class="login-heading">Welcome back</div>
  <div class="login-sub">ENTER YOUR CODE TO CLOCK IN</div>
  <div class="field-group">
    <input type="text" id="bizCodeEntry" placeholder="Business code" class="field-input" autocapitalize="none" spellcheck="false">
    <input type="text" id="empNameEntry" placeholder="Your name" class="field-input">
  </div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
    <div class="pin-dot" id="d5"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn pin-btn-back" onclick="pinPress('C')">⌫</button>
    <button class="pin-btn" onclick="pinPress('0')">0</button>
    <button class="pin-btn pin-btn-ok" onclick="pinPress('OK')">OK</button>
  </div>
  <div class="pin-err" id="pinErr"></div>
  <!-- Kiosk mode toggle — manager enables this once on a shared counter device -->
  <div class="kiosk-toggle" onclick="toggleKiosk()">
    <div class="kiosk-switch" id="kioskSwitch"></div>
    <div class="kiosk-toggle-label">KIOSK MODE (shared device)</div>
  </div>
</div>

<!-- Kiosk success overlay — shown after clock-in/out before auto-resetting -->
<div id="kioskSuccess">
  <div class="kiosk-success-icon" id="kioskSuccessIcon">✅</div>
  <div class="kiosk-success-title" id="kioskSuccessTitle"></div>
  <div class="kiosk-success-sub" id="kioskSuccessSub"></div>
  <div class="kiosk-countdown" id="kioskCountdown"></div>
</div>


</div><!-- end container -->

<!-- PORTAL -->
<div id="portal">

  <!-- Hero identity card -->
  <div class="portal-hero">
    <div class="hero-identity">
      <div class="hero-avatar" id="portalAvatar"></div>
      <div>
        <div class="hero-name" id="portalName"></div>
        <div class="hero-role" id="portalRole"></div>
        <div class="hero-biz" id="portalBiz"></div>
      </div>
    </div>
    <div id="portalGreeting" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b8fc9;margin-bottom:16px;letter-spacing:0.5px;"></div>
    <!-- Check In / Out button -->
    <div id="clockCard"><button class="clock-in-btn" onclick="doClockIn()">▶ Clock In</button></div>
  </div>

  <!-- Stats strip -->
  <div class="stat-row" id="portalStats"></div>

  <!-- Tabs + content -->
  <div class="tab-section">
    <div class="tab-row">
      <button class="tab active" onclick="showTab('shifts',this)">Shifts</button>
      <button class="tab" onclick="showTab('leaves',this)">Leave</button>
      <button class="tab" onclick="showTab('pay',this)">Pay</button>
    </div>

    <div class="month-nav">
      <button class="nav-btn" onclick="chMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="nav-btn" onclick="chMonth(1)">›</button>
    </div>

    <div id="tab-shifts"><div id="shiftsList"></div></div>
    <div id="tab-leaves" style="display:none;"><div id="leavesList"></div></div>
    <div id="tab-pay" style="display:none;"><div id="payCard"></div></div>
  </div>

  <button class="signout-btn" onclick="logout()">Sign out</button>
</div>



<script>
var API = 'https://ems-api-mgye.onrender.com';
var EMP_TOKEN = null;
var empData = null;
var allShifts = [], allLeaves = [], allDeds = [];
var viewMonth = new Date();
var currentPin = '';
var currentTab = 'shifts';
var kioskMode = localStorage.getItem('shq_kiosk_mode') === '1';
var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function toggleKiosk() {
  kioskMode = !kioskMode;
  localStorage.setItem('shq_kiosk_mode', kioskMode ? '1' : '0');
  updateKioskSwitch();
}
function updateKioskSwitch() {
  var sw = document.getElementById('kioskSwitch');
  if (sw) { if (kioskMode) sw.classList.add('on'); else sw.classList.remove('on'); }
}
updateKioskSwitch();

// Remember the business code on this device (not sensitive — just a shop identifier) so a shared kiosk doesn't need retyping it every time
(function(){
  var saved = localStorage.getItem('shq_kiosk_biz_code');
  if (saved) {
    var el = document.getElementById('bizCodeEntry');
    if (el) el.value = saved;
  }
  // Restore employee session if still valid — but NOT in kiosk mode (shared device always shows login)
  var savedToken = localStorage.getItem('shq_emp_token');
  var savedEmp = localStorage.getItem('shq_emp_data');
  if (!kioskMode && savedToken && savedEmp) {
    try {
      var payload = JSON.parse(atob(savedToken.split('.')[1]));
      if (payload.exp && payload.exp * 1000 > Date.now()) {
        // Token valid — hide login screen IMMEDIATELY (no flash) before async data load
        var ps = document.getElementById('pinScreen');
        if (ps) ps.style.display = 'none';
        EMP_TOKEN = savedToken;
        empData = JSON.parse(savedEmp);
        loadPortalData().then(function(){
          showPortal();
        }).catch(function(){
          localStorage.removeItem('shq_emp_token');
          localStorage.removeItem('shq_emp_data');
          var ps2 = document.getElementById('pinScreen');
          if (ps2) ps2.style.display = '';
        });
      } else {
        localStorage.removeItem('shq_emp_token');
        localStorage.removeItem('shq_emp_data');
      }
    } catch(e) {
      localStorage.removeItem('shq_emp_token');
      localStorage.removeItem('shq_emp_data');
    }
  }
})();

function dk(d) { var dt = new Date(d); return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function fmt(d) { if (!d) return '—'; var dt = new Date(d + 'T00:00:00'); var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return dt.getDate() + ' ' + m[dt.getMonth()]; }

// PIN entry
function pinPress(key) {
  var err = document.getElementById('pinErr');
  err.textContent = '';
  if (key === 'C') { currentPin = currentPin.slice(0,-1); }
  else if (key === 'OK') { doVerify(); return; }
  else if (currentPin.length < 6) { currentPin += key; }
  updateDots();
  if (currentPin.length === 6) doVerify();
}

function updateDots() {
  for (var i = 0; i < 6; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < currentPin.length);
  }
}

async function doVerify() {
  if (currentPin.length < 4) { document.getElementById('pinErr').textContent = 'Enter your PIN'; return; }
  var bizCode = document.getElementById('bizCodeEntry').value.trim().toLowerCase();
  var empName = document.getElementById('empNameEntry').value.trim();
  if (!bizCode) { document.getElementById('pinErr').textContent = 'Enter your business code'; return; }
  if (!empName) { document.getElementById('pinErr').textContent = 'Enter your name'; return; }
  try {
    var verR = await fetch(API + '/api/employees/verify-pin', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({business_code: bizCode, name: empName, pin: currentPin})
    });
    var ver = await verR.json();
    if (verR.status === 404) { document.getElementById('pinErr').textContent = 'Employee not found'; currentPin = ''; updateDots(); return; }
    if (!ver.match) { document.getElementById('pinErr').textContent = ver.error || 'Wrong PIN'; currentPin = ''; updateDots(); return; }
    // Store scoped employee token for authenticated reads
    EMP_TOKEN = ver.emp_token;
    localStorage.setItem('shq_kiosk_biz_code', bizCode);
    localStorage.setItem('shq_emp_token', EMP_TOKEN);
    localStorage.setItem('shq_emp_data', JSON.stringify(ver.employee));
    empData = ver.employee;
    empData.biz_id = ver.employee.business_id;
    empData.biz_name = bizCode.toUpperCase();
    // Fetch business name (public route)
    try {
      var bizR = await fetch(API + '/api/business/' + bizCode);
      if (bizR.ok) { var biz = await bizR.json(); empData.biz_name = biz.name; }
    } catch(e) {}
    await loadPortalData();
    showPortal();
  } catch(e) { document.getElementById('pinErr').textContent = 'Connection error'; currentPin = ''; updateDots(); }
}

async function loadPortalData() {
  var h = {'x-emp-token': EMP_TOKEN};
  try {
    var sr = await fetch(API + '/api/shifts?business_id=' + empData.biz_id, { headers: h });
    var allS = await sr.json();
    allShifts = (Array.isArray(allS) ? allS : []).filter(function(s){ return s.emp_id === empData.id; });
  } catch(e) { console.error('Failed to load shifts:', e); allShifts = []; }
  try {
    var lr = await fetch(API + '/api/leaves?business_id=' + empData.biz_id, { headers: h });
    var allL = await lr.json();
    allLeaves = (Array.isArray(allL) ? allL : []).filter(function(l){ return l.emp_id === empData.id; });
  } catch(e) { console.error('Failed to load leaves:', e); allLeaves = []; }
  try {
    var dr = await fetch(API + '/api/deductions?business_id=' + empData.biz_id, { headers: h });
    var allD = await dr.json();
    allDeds = (Array.isArray(allD) ? allD : []).filter(function(d){ return d.emp_id === empData.id; });
  } catch(e) { console.error('Failed to load deductions:', e); allDeds = []; }
}

function showPortal() {
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('portal').style.display = '';
  var displayName = (empData && empData.name) ? empData.name : 'You';
  document.getElementById('navName').textContent = displayName;
  document.getElementById('portalAvatar').textContent = displayName[0] ? displayName[0].toUpperCase() : '?';
  document.getElementById('portalName').textContent = displayName;
  document.getElementById('portalRole').textContent = (empData.role || 'Staff').toUpperCase();
  var bizEl = document.getElementById('portalBiz');
  if (bizEl) bizEl.textContent = empData.biz_name || '';
  // Greeting based on time of day
  var h = new Date().getHours();
  var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  var greetEl = document.getElementById('portalGreeting');
  if (greetEl) greetEl.textContent = greet + ', ' + displayName.split(' ')[0] + '. Have a great shift! 👋';
  try { renderClockCard(); } catch(e) { console.error('renderClockCard failed:', e); }
  try { renderStats(); } catch(e) { console.error('renderStats failed:', e); }
  try { renderMonth(); } catch(e) { console.error('renderMonth failed:', e); }
}

function renderClockCard() {
  var today = dk(new Date());
  var shift = allShifts.find(function(s){ return s.date === today; });
  var el = document.getElementById('clockCard');
  if (!el) return;
  if (!shift) {
    el.innerHTML = '<button class="clock-in-btn" onclick="doClockIn()">▶ Clock In</button>';
  } else if (shift.check_in && !shift.check_out) {
    var since = shift.check_in ? shift.check_in.slice(0,5) : '';
    el.innerHTML =
      '<div class="shift-status-bar"><div class="shift-status-dot"></div><div class="shift-status-text">ON SHIFT SINCE ' + since + '</div></div>' +
      '<button class="clock-out-btn" onclick="doClockOut(' + shift.id + ')">■ Clock Out</button>';
  } else {
    var hrs = (parseFloat(shift.hours)||0).toFixed(2);
    el.innerHTML = '<div class="done-bar">✓ Done today · ' + shift.check_in.slice(0,5) + ' → ' + shift.check_out.slice(0,5) + ' · ' + hrs + 'h</div>';
  }
}

function showKioskSuccess(icon, title, sub) {
  document.getElementById('kioskSuccessIcon').textContent = icon;
  document.getElementById('kioskSuccessTitle').textContent = title;
  document.getElementById('kioskSuccessSub').textContent = sub;
  document.getElementById('kioskSuccess').classList.add('show');
  var secs = 4;
  var cd = document.getElementById('kioskCountdown');
  cd.textContent = 'Returning to login in ' + secs + '...';
  var timer = setInterval(function() {
    secs--;
    if (secs <= 0) {
      clearInterval(timer);
      document.getElementById('kioskSuccess').classList.remove('show');
      logout();
    } else {
      cd.textContent = 'Returning to login in ' + secs + '...';
    }
  }, 1000);
}

async function doClockIn() {
  var btn = document.querySelector('.clock-in-btn');
  if (btn) { btn.textContent = 'Clocking in...'; btn.disabled = true; }
  try {
    var now = new Date();
    var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var r = await fetch(API + '/api/shifts', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-emp-token': EMP_TOKEN},
      body: JSON.stringify({ emp_id: empData.id, business_id: empData.biz_id, date: dk(now), check_in: timeStr })
    });
    var s = await r.json();
    if (!r.ok) {
      alert('Check-in failed: ' + (s.error || 'Unknown error') + ' (status ' + r.status + ')');
      if (btn) { btn.textContent = '▶ Clock In'; btn.disabled = false; }
      return;
    }
    allShifts.push(s);
    if (kioskMode) {
      showKioskSuccess('✅', 'Clocked in at ' + timeStr, empData.name + ' · ' + (empData.role || 'Staff'));
    } else {
      renderClockCard();
      renderStats();
    }
  } catch(e) {
    alert('Connection error: ' + e.message + '. Check your internet connection.');
    if (btn) { btn.textContent = '▶ Clock In'; btn.disabled = false; }
  }
}

async function doClockOut(shiftId) {
  try {
    var now = new Date();
    var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var r = await fetch(API + '/api/shifts/' + shiftId + '/checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-emp-token': EMP_TOKEN},
      body: JSON.stringify({ check_out: timeStr })
    });
    var updated = await r.json();
    if (!r.ok) { alert(updated.error || 'Could not check out'); return; }
    var idx = allShifts.findIndex(function(s){ return s.id === shiftId; });
    if (idx >= 0) allShifts[idx] = updated;
    if (kioskMode) {
      var hrs = (parseFloat(updated.hours)||0).toFixed(2);
      showKioskSuccess('👋', 'Clocked out at ' + timeStr, empData.name + ' · ' + hrs + 'h today');
    } else {
      renderClockCard();
      renderStats();
      renderMonth();
    }
  } catch(e) { alert('Connection error'); }
}

function renderStats() {
  var today = dk(new Date());
  var thisMonth = today.slice(0,7);
  var monthShifts = allShifts.filter(function(s){ return s.date && s.date.slice(0,7) === thisMonth && s.check_out; });
  var totalH = monthShifts.reduce(function(a,s){ return a+(parseFloat(s.hours)||0); },0);
  var regH = monthShifts.reduce(function(a,s){ return a+(parseFloat(s.regular_hours)||parseFloat(s.hours)||0); },0);
  var otH = monthShifts.reduce(function(a,s){ return a+(parseFloat(s.ot_hours)||0); },0);
  var rate = parseFloat(empData.rate)||0;
  var bonuses = allDeds.filter(function(d){ return d.month===thisMonth && d.type==='bonus'; }).reduce(function(a,d){ return a+parseFloat(d.amount); },0);
  var deductions = allDeds.filter(function(d){ return d.month===thisMonth && d.type==='deduction'; }).reduce(function(a,d){ return a+parseFloat(d.amount); },0);
  var netPay = (regH*rate) + (otH*rate*1.5) + bonuses - deductions;
  var onShift = allShifts.find(function(s){ return s.date===today && s.check_in && !s.check_out; });
  document.getElementById('portalStats').innerHTML =
    '<div class="stat-box"><div class="stat-v">' + totalH.toFixed(0) + 'h</div><div class="stat-k">THIS MONTH</div></div>' +
    '<div class="stat-box"><div class="stat-v" style="color:#16a34a;">L ' + netPay.toFixed(0) + '</div><div class="stat-k">PAY DUE</div></div>' +
    '<div class="stat-box"><div class="stat-v" style="color:' + (onShift?'#2154f4':'#888') + ';">' + (onShift?'Yes':'No') + '</div><div class="stat-k">ON SHIFT</div></div>';
}

function chMonth(dir) { viewMonth.setMonth(viewMonth.getMonth()+dir); renderMonth(); }

function renderMonth() {
  document.getElementById('monthLabel').textContent = months[viewMonth.getMonth()] + ' ' + viewMonth.getFullYear();
  var ym = viewMonth.getFullYear() + '-' + String(viewMonth.getMonth()+1).padStart(2,'0');
  if (currentTab === 'shifts') renderShifts(ym);
  else if (currentTab === 'leaves') renderLeaves(ym);
  else renderPay(ym);
}

function showTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-shifts').style.display = tab==='shifts' ? '' : 'none';
  document.getElementById('tab-leaves').style.display = tab==='leaves' ? '' : 'none';
  document.getElementById('tab-pay').style.display = tab==='pay' ? '' : 'none';
  renderMonth();
}

function renderShifts(ym) {
  var ms = allShifts.filter(function(s){ return s.date && s.date.slice(0,7)===ym; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var rate = parseFloat(empData.rate)||0;
  var html = '';
  if (ms.length === 0) { html = '<div class="empty">No shifts this month</div>'; }
  else ms.forEach(function(s) {
    var status = s.check_out ? (s.is_late ? 'late' : 'done') : (s.check_in ? 'active' : 'done');
    var label = s.check_out ? (s.is_late ? 'Late' : 'Done') : 'On shift';
    var hours = s.check_out ? (parseFloat(s.hours)||0).toFixed(1) + 'h' : '—';
    var dayPay = '';
    if (s.check_out) {
      var regH = parseFloat(s.regular_hours) || parseFloat(s.hours) || 0;
      var otH = parseFloat(s.ot_hours) || 0;
      var pay = (regH*rate) + (otH*rate*1.5);
      dayPay = '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#16a34a;margin-top:2px;">L ' + pay.toFixed(0) + '</div>';
    }
    html += '<div class="shift-row">' +
      '<div><div class="shift-date">' + fmt(s.date) + '</div>' +
      '<div class="shift-time">' + (s.check_in||'—') + (s.check_out?' → '+s.check_out:'') + (s.is_late?' · <span style="color:#dc2626;">+'+s.late_minutes+'m late</span>':'') + '</div>' + dayPay + '</div>' +
      '<div style="display:flex;align-items:center;gap:7px;">' +
      '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#888;">' + hours + '</span>' +
      '<span class="badge ' + status + '">' + label + '</span>' +
      '</div></div>';
  });
  document.getElementById('shiftsList').innerHTML = html;
}

function renderLeaves(ym) {
  var ml = allLeaves.filter(function(l){ return l.date && l.date.slice(0,7)===ym; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var html = '';
  if (ml.length === 0) { html = '<div class="empty">No leave this month</div>'; }
  else ml.forEach(function(l) {
    html += '<div class="leave-row"><div><div class="shift-date">' + fmt(l.date) + '</div>' +
      (l.note ? '<div class="shift-time">' + l.note + '</div>' : '') + '</div>' +
      '<span class="badge" style="background:#fffbeb;color:#d97706;border:1px solid #fde68a;">' + (l.type||'Leave') + '</span>' +
      '</div>';
  });
  document.getElementById('leavesList').innerHTML = html;
}

function renderPay(ym) {
  var ms = allShifts.filter(function(s){ return s.date && s.date.slice(0,7)===ym && s.check_out; });
  var totalH = ms.reduce(function(a,s){ return a+(parseFloat(s.hours)||0); },0);
  var regH = ms.reduce(function(a,s){ return a+(parseFloat(s.regular_hours)||parseFloat(s.hours)||0); },0);
  var otH = ms.reduce(function(a,s){ return a+(parseFloat(s.ot_hours)||0); },0);
  var rate = parseFloat(empData.rate)||0;
  var basePay = regH * rate;
  var otPay = otH * rate * 1.5;
  var bonuses = allDeds.filter(function(d){ return d.month===ym && d.type==='bonus'; }).reduce(function(a,d){ return a+parseFloat(d.amount); },0);
  var deductions = allDeds.filter(function(d){ return d.month===ym && d.type==='deduction'; }).reduce(function(a,d){ return a+parseFloat(d.amount); },0);
  var gross = basePay + otPay + bonuses - deductions;
  var lateCount = ms.filter(function(s){ return s.is_late; }).length;
  document.getElementById('payCard').innerHTML =
    '<div class="card">' +
    '<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#888;margin-bottom:12px;">PAY SUMMARY — ' + months[viewMonth.getMonth()].toUpperCase() + ' ' + viewMonth.getFullYear() + '</div>' +
    '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span>Shifts worked</span><span style="font-weight:600;">' + ms.length + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span>Total hours</span><span style="font-weight:600;">' + totalH.toFixed(2) + 'h</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span>Regular (' + regH.toFixed(2) + 'h × L ' + rate.toFixed(2) + ')</span><span>L ' + basePay.toFixed(2) + '</span></div>' +
    (otH > 0 ? '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span>Overtime (' + otH.toFixed(2) + 'h × 1.5)</span><span>L ' + otPay.toFixed(2) + '</span></div>' : '') +
    (bonuses > 0 ? '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span style="color:#16a34a;">Bonuses</span><span style="color:#16a34a;">+L ' + bonuses.toFixed(2) + '</span></div>' : '') +
    (deductions > 0 ? '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span style="color:#dc2626;">Deductions</span><span style="color:#dc2626;">-L ' + deductions.toFixed(2) + '</span></div>' : '') +
    (lateCount > 0 ? '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f1ee;font-size:13px;"><span style="color:#dc2626;">Late arrivals</span><span style="color:#dc2626;">' + lateCount + 'x</span></div>' : '') +
    '<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;border-top:2px solid #e8e6e1;font-size:15px;font-weight:800;"><span>Pay Due</span><span style="color:#2154f4;">L ' + gross.toFixed(2) + '</span></div>' +
    '</div>';
}

function logout() {
  empData = null;
  EMP_TOKEN = null;
  allShifts = [];
  allLeaves = [];
  allDeds = [];
  currentPin = '';
  localStorage.removeItem('shq_emp_token');
  localStorage.removeItem('shq_emp_data');
  updateDots();
  document.getElementById('portal').style.display = 'none';
  document.getElementById('pinScreen').style.display = '';
  document.getElementById('pinErr').textContent = '';
  document.getElementById('empNameEntry').value = '';
}
</script>
